context:
  version: "0.1.3"
  python_min: "3.13"

package:
  name: pixi-skills
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/43/e2/7b7b075a860389bd2b7678dbf73c5fc5d7b0cb34c7c5bfe4d98bed6caa42/pixi_skills-${{ version }}.tar.gz
  sha256: 51ef68d53f7836e4c7135ae8503af22c545c52e64740bdddc29539d394253e7e

build:
  noarch: python
  python:
    entry_points:
      - pixi-skills=pixi_skills.cli:app
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - typer >=0.12
    - rich >=13
    - questionary >=2
    - pyyaml >=6

tests:
  - python:
      imports:
      - pixi_skills
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - pixi-skills --help

about:
  homepage: https://github.com/pavelzw/pixi-skills
  summary: Manage coding agent skills using pixi
  description: |
    Manage and install coding agent skills across multiple LLM backends using pixi.

    pixi-skills discovers skills packaged in pixi environments and lets you install them into the configuration directories of various coding agents via symlinks.
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://github.com/pavelzw/pixi-skills
  repository: https://github.com/pavelzw/pixi-skills

extra:
  recipe-maintainers:
    - pavelzw
